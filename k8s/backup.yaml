apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nightly-backups
  namespace: mern-ecommerce
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-full-backup
  namespace: mern-ecommerce
spec:
  schedule: "0 22 * * *"
  timeZone: Asia/Kathmandu
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: mongo-dump
              image: mongo:7
              command: ["sh", "-c"]
              args:
                - mongodump --uri="$MONGO_URI" --archive=/work/database.archive.gz --gzip
              env:
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: mern-ecommerce-secrets
                      key: MONGO_URI
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            - name: archive
              image: docker.io/dockerhub_user/mern-ecommerce-backend:staging
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  stamp=$(date +%Y%m%d-%H%M%S)
                  mkdir -p /backups
                  cp /work/database.archive.gz "/backups/database-${stamp}.archive.gz"
                  tar -czf "/backups/backend-${stamp}.tar.gz" -C /app .
                  find /backups -type f -mtime +14 -delete
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: backups
                  mountPath: /backups
          volumes:
            - name: work
              emptyDir: {}
            - name: backups
              persistentVolumeClaim:
                claimName: nightly-backups
