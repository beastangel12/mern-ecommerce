# Template only. Create the real secret out-of-band; never commit credentials.
apiVersion: v1
kind: Secret
metadata:
  name: mern-ecommerce-secrets
  namespace: mern-ecommerce
type: Opaque
stringData:
  ACCESS_TOKEN_SECRET: replace-with-long-random-secret
  REFRESH_TOKEN_SECRET: replace-with-different-long-random-secret
  MONGO_USER: mernapp
  MONGO_PASSWORD: replace-with-strong-password
  MONGO_URI: mongodb://mernapp:replace-with-strong-password@mongo:27017/mern-ecommerce?authSource=admin
  UPSTASH_REDIS_URL: redis://redis:6379
  STRIPE_SECRET_KEY: replace-with-stripe-secret-key
  CLOUDINARY_CLOUD_NAME: replace-with-cloud-name
  CLOUDINARY_API_KEY: replace-with-api-key
  CLOUDINARY_API_SECRET: replace-with-api-secret
