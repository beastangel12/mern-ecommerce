apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - namespace.yaml
  - ../config.yaml
  - ../backend.yaml
  - ../frontend.yaml
images:
  - name: docker.io/dockerhub_user/mern-ecommerce-backend
    newName: docker.io/dockerhub_user/mern-ecommerce-backend
    newTag: IMAGE_TAG
  - name: docker.io/dockerhub_user/mern-ecommerce-frontend
    newName: docker.io/dockerhub_user/mern-ecommerce-frontend
    newTag: IMAGE_TAG
patches:
  - target:
      version: v1
      kind: ConfigMap
      name: mern-ecommerce-config
    patch: |-
      - op: replace
        path: /data/CLIENT_URL
        value: https://shop.example.com
