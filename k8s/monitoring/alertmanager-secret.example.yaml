# Configure a real SMTP provider and recipient. Store as a Kubernetes Secret,
# do not commit the populated secret.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.example.com:587
      smtp_from: alerts@example.com
      smtp_auth_username: alerts@example.com
      smtp_auth_password: replace-with-mail-app-password
    route:
      receiver: email
      group_by: [alertname, instance]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: email
        email_configs:
          - to: ops@example.com
            send_resolved: true
