apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: Node Exporter
        orgId: 1
        folder: Infrastructure
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards
  node-exporter-dashboard.json: |
    {
      "id": null,
      "uid": "node-exporter-lab",
      "title": "Node Exporter: CPU and Memory",
      "tags": ["node-exporter"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {"id":1,"type":"timeseries","title":"CPU busy (%)","gridPos":{"h":9,"w":12,"x":0,"y":0},"targets":[{"expr":"100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)","legendFormat":"{{instance}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent"},"overrides":[]},"datasource":{"type":"prometheus","uid":"prometheus"}},
        {"id":2,"type":"timeseries","title":"Memory used (%)","gridPos":{"h":9,"w":12,"x":12,"y":0},"targets":[{"expr":"(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100","legendFormat":"{{instance}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent"},"overrides":[]},"datasource":{"type":"prometheus","uid":"prometheus"}},
        {"id":3,"type":"stat","title":"Node exporter up","gridPos":{"h":5,"w":24,"x":0,"y":9},"targets":[{"expr":"up{job=\"node-exporter\"}","legendFormat":"{{instance}}","refId":"A"}],"datasource":{"type":"prometheus","uid":"prometheus"}}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.2.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/provider.yaml
              subPath: dashboard-provider.yaml
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/node-exporter.json
              subPath: node-exporter-dashboard.json
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      nodePort: 30300
