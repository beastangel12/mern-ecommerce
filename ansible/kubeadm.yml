---
- name: Prepare Ubuntu 22.04 Kubernetes nodes
  hosts: k8s_cluster
  become: true
  vars:
    kubernetes_minor: "v1.37"
    pod_network_cidr: "10.244.0.0/16"
  tasks:
    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disable swap in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(.*\sswap\s.*)$'
        replace: '# \1'

    - name: Load kernel modules at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load required kernel modules
      ansible.builtin.modprobe:
        name: "{{ item }}"
      loop: [overlay, br_netfilter]

    - name: Configure Kubernetes networking sysctls
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctls
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Install container runtime and repository tools
      ansible.builtin.apt:
        name: [containerd, ca-certificates, curl, gpg, apt-transport-https]
        state: present
        update_cache: true

    - name: Configure containerd systemd cgroups
      ansible.builtin.shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml
      notify: Restart containerd

    - name: Enable containerd
      ansible.builtin.service:
        name: containerd
        state: started
        enabled: true

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Kubernetes package signing key
      ansible.builtin.shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/Release.key | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Install and hold kubelet, kubeadm, kubectl
      ansible.builtin.apt:
        name: [kubelet, kubeadm, kubectl]
        state: present
        update_cache: true

    - name: Hold Kubernetes package versions
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubelet, kubeadm, kubectl]

    - name: Enable kubelet
      ansible.builtin.service:
        name: kubelet
        enabled: true

  handlers:
    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted

- name: Initialize the control plane
  hosts: control_plane
  become: true
  tasks:
    - name: Initialize kubeadm once
      ansible.builtin.command: "kubeadm init --apiserver-advertise-address={{ kube_control_plane_ip | default(ansible_host) }} --pod-network-cidr=10.244.0.0/16"
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create kubeconfig directory for Vagrant user
      ansible.builtin.file:
        path: "/home/{{ ansible_user | default('vagrant') }}/.kube"
        state: directory
        owner: "{{ ansible_user | default('vagrant') }}"
        group: "{{ ansible_user | default('vagrant') }}"
        mode: "0755"

    - name: Copy administrator kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user | default('vagrant') }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user | default('vagrant') }}"
        group: "{{ ansible_user | default('vagrant') }}"
        mode: "0600"

    - name: Install Flannel pod network
      become_user: "{{ ansible_user | default('vagrant') }}"
      ansible.builtin.command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      changed_when: true

    - name: Install local-path storage provisioner for lab PVCs
      become_user: "{{ ansible_user | default('vagrant') }}"
      ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.36/deploy/local-path-storage.yaml
      changed_when: true

    - name: Install Metrics Server for HPA CPU metrics
      become_user: "{{ ansible_user | default('vagrant') }}"
      ansible.builtin.command: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
      changed_when: true

    - name: Allow Metrics Server to read lab kubelet metrics with self-signed kubelet certs
      become_user: "{{ ansible_user | default('vagrant') }}"
      ansible.builtin.shell: |
        kubectl -n kube-system get deployment metrics-server -o jsonpath='{.spec.template.spec.containers[0].args}' | grep -q -- --kubelet-insecure-tls || \
          kubectl -n kube-system patch deployment metrics-server --type=json --patch='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
      changed_when: false

    - name: Create worker join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: worker_join_command
      changed_when: false

- name: Join worker nodes to the cluster
  hosts: workers
  become: true
  tasks:
    - name: Join the control plane
      ansible.builtin.command: "{{ hostvars[groups['control_plane'][0]].worker_join_command.stdout }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
